services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: mahg_llm_lab-llama
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8090
      --ctx-size 4096
    ports:
      - "8090:8090"
    restart: unless-stopped